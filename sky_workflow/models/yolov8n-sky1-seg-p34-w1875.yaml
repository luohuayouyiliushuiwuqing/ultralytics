# Simplification C -- drop the stride-32 branch AND narrow the network.
#
# Diff against yolov8n-sky1-seg.yaml (A + B combined):
#   scales n: [0.33, 0.25, 1024] -> [0.33, 0.1875, 1024]
#   removed the last three head layers (Conv[512,3,2], Concat[[-1,9]], C2f[1024])
#   Segment input [15, 18, 21] -> [15, 18]
#
# Measured (imgsz=320, hook-counted conv MACs x2):
#   base                    3.088M params   2.108 GFLOPs
#   here                    1.205M params   1.200 GFLOPs   (-61% params, -43% FLOPs)
#
# Combined caveats of A and B:
#   * width 0.1875 leaves much less feature capacity -- watch for underfitting.
#   * dropping P5 caps the largest predictable box at 30 x 16 = 480 px, so this
#     variant must be trained and run at imgsz 320 (or lower), not 640.
#
# This is the aggressive option. If it costs more than ~0.02 mask mAP50 against
# the current best (0.815), prefer variant A (width only), which keeps the
# topology intact.

nc: 1
scales:
  n: [0.33, 0.1875, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [[15, 18], 1, Segment, [nc, 1, 32]]
